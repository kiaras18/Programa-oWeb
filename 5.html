<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio de Números</title>
</head>
<body>
    <h1>Sorteio de Números</h1>

    <label for="minimo">Valor mínimo:</label>
    <input type="number" id="minimo" step="1"><br>

    <label for="maximo">Valor máximo:</label>
    <input type="number" id="maximo" step="1"><br>

    <button type="button" id="botaoSortear">Sortear</button>

    <p id="resultado"></p>
    <h2>Números sorteados</h2>
    <div id="listaSorteados"></div>

    <script>
        let valoresSorteados = [];

        function sortear() {
            let minimoTexto = document.getElementById("minimo").value;
            let maximoTexto = document.getElementById("maximo").value;
            let resultado = document.getElementById("resultado");

            if (minimoTexto === "" || maximoTexto === "") {
                resultado.innerText = "Digite o valor mínimo e o máximo.";
                return;
            }

            let minimo = Number(minimoTexto);
            let maximo = Number(maximoTexto);

            if (!Number.isInteger(minimo) || !Number.isInteger(maximo)) {
                resultado.innerText = "Digite somente números inteiros.";
                return;
            }

            if (minimo > maximo) {
                resultado.innerText = "O mínimo não pode ser maior que o máximo.";
                return;
            }

            let numero = Math.floor(Math.random() * (maximo - minimo + 1)) + minimo;
            resultado.innerText = "Número sorteado: " + numero;

            let encontrado = false;

            for (let i = 0; i < valoresSorteados.length; i++) {
                if (valoresSorteados[i].numero === numero) {
                    valoresSorteados[i].quantidade++;
                    encontrado = true;
                }
            }

            if (encontrado === false) {
                valoresSorteados.push({ numero: numero, quantidade: 1 });
            }

            mostrarSorteados();
        }

        function mostrarSorteados() {
            let lista = document.getElementById("listaSorteados");
            lista.innerHTML = "";

            for (let i = 0; i < valoresSorteados.length; i++) {
                lista.innerHTML += "<p>" + valoresSorteados[i].numero +
                    " - sorteado " + valoresSorteados[i].quantidade + " vez(es)</p>";
            }
        }

        document.getElementById("botaoSortear").addEventListener("click", sortear);
    </script>
</body>
</html>
