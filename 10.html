<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Aritmética</title>
</head>
<body>
    <h1>Calculadora Aritmética</h1>

    <label for="numero1">Primeiro número:</label>
    <input type="number" id="numero1" step="any"><br>

    <label for="numero2">Segundo número:</label>
    <input type="number" id="numero2" step="any"><br>

    <label for="operacao">Operação:</label>
    <select id="operacao">
        <option value="soma">Adição (+)</option>
        <option value="subtracao">Subtração (-)</option>
        <option value="multiplicacao">Multiplicação (*)</option>
        <option value="divisao">Divisão (/)</option>
    </select><br>

    <button type="button" id="calcular">Calcular</button>
    <p id="resultado"></p>

    <script>
        document.getElementById("calcular").addEventListener("click", function() {
            let texto1 = document.getElementById("numero1").value;
            let texto2 = document.getElementById("numero2").value;
            let operacao = document.getElementById("operacao").value;
            let resultado = document.getElementById("resultado");

            if (texto1 === "" || texto2 === "") {
                resultado.innerText = "Digite os dois números.";
                return;
            }

            let numero1 = parseFloat(texto1);
            let numero2 = parseFloat(texto2);
            let conta;

            if (operacao === "soma") {
                conta = numero1 + numero2;
            } else if (operacao === "subtracao") {
                conta = numero1 - numero2;
            } else if (operacao === "multiplicacao") {
                conta = numero1 * numero2;
            } else if (operacao === "divisao") {
                if (numero2 === 0) {
                    resultado.innerText = "Não é possível dividir por zero.";
                    return;
                }
                conta = numero1 / numero2;
            }

            resultado.innerText = "Resultado: " + conta;
        });
    </script>
</body>
</html>
