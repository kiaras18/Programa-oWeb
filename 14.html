<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captura de Teclas do Teclado</title>
    <style>
        #saida { min-height: 45px; border: 1px solid #888; padding: 12px; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>Captura de Teclas do Teclado</h1>
    <p>Digite no teclado para visualizar as teclas pressionadas:</p>
    <div id="saida"></div>

    <script>
        let saida = document.getElementById("saida");
        let texto = "";

        document.addEventListener("keydown", function(evento) {
            console.log("Tecla pressionada:", evento.key, "Código:", evento.code);

            if (evento.key === "Backspace") {
                texto = texto.slice(0, -1);
            } else if (evento.key.length === 1) {
                texto += evento.key;
            }

            saida.innerText = texto;
        });
    </script>
</body>
</html>
