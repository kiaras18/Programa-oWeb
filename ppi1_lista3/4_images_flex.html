<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="styleImages.css">
    <title>Imagens & Flexbox</title>
    
</head>
<body>

    <div class="container">
    
        <div class="rec">
            <img src="../imagens/i2.jpg" alt="Grandes Montanhas">
            <div class="icon" style="background-color: #6b450c; color: #fff;">⛰️</div>
        </div>

        
        <div class="ativo">
            <img src="../imagens/i3.jpg" alt="Florestas">
            <div class="icon" style="background-color: green; color: #fff;">🌳</div>
            <div class="info">
                <h3>Florestas</h3>
                <p>Linda fauna e flora</p>
            </div>
        </div>

        <div class="rec">
            <img src="../imagens/i4.jpg" alt="Praia Paradiasiaca">
            <div class="icon" style="background-color: #fbff00; color: #fff;">🏖️</div>
        </div>

        <div class="rec">
            <img src="../imagens/i5.jpg" alt="Montanhas congeladas">
            <div class="icon" style="background-color: #c5d2dd; color: #fff;">❄️</div>
        </div>

        <div class="rec">
            <img src="../imagens/i1.jpg" alt="Por do Sol">
            <div class="icon" style="background-color: #ff9900; color: #fff;">🌅</div>
        </div>
    </div>

</body>
</html>
