<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilizando prompt e alert</title>
</head>
<body>
    <h1>Utilizando prompt e alert</h1>
    <p>Ao carregar a página, será solicitado seu nome.</p>

    <script>
        let nome = prompt("Qual é o seu nome?");

        if (nome === null || nome.trim() === "") {
            alert("Você não informou seu nome.");
        } else {
            alert("Olá, " + nome + "! Seja bem-vindo(a)!");
        }
    </script>
</body>
</html>
