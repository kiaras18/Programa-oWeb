<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barco</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, LightSkyBlue, white);
            overflow: hidden;
            position: relative;
        }
      .nuvem{
            position: absolute;
            top: 8%;
            left: -200px;
            width: 150px;
            height: 100px;
            animation: moverNuvem 28s linear infinite;
            z-index: 1;
        }

        .nuvem1 {
            font-size: 110px;
            line-height: 100px;
            user-select: none;
            display: inline-block;
        }
        .barco {
            position: absolute;
            bottom: 20%;
            left: -150px;
            width: 100px;
            height: 100px;
            animation: navegar 18s linear infinite;
            z-index: 3;
        }
        .barco1{
            font-size: 80px;
            text-align: center;
            line-height: 100px;
            user-select: none;
            display: inline-block;
            animation: balanco 2.5s ease-in-out infinite;
        }
        .mar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 25vh;
            background-color: RoyalBlue;
            z-index: 2;
        }
        .mar::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 0;
            width: 200%;
            height: 30px;
            background: radial-gradient(circle at 50% 100%, transparent 15px, RoyalBlue 16px);
            background-size: 40px 30px;
            animation: moverOndas 4s linear infinite;
            z-index: 4;
        }
        .mar::before {
            content: '';
            position: absolute;
            top: -25px;
            left: -50px;
            width: 200%;
            height: 30px;
            background: radial-gradient(circle at 50% 100%, transparent 15px, SteelBlue 16px);
            background-size: 50px 30px;
            opacity: 0.7;
            animation: moverOndasTras 6s linear infinite;
            z-index: 2;
        }
        @keyframes moverNuvem {
            0% { left: -150px; }
            100% { left: 100vw; }
        }
        @keyframes navegar {
            0% { left: -130px; }
            100% { left: 100vw; }
        }
        @keyframes balanco {
            0%, 100% { transform: rotate(-6deg) translateY(0px); }
            50% { transform: rotate(6deg) translateY(-8px); }
        }
        @keyframes moverOndas {
            0% { transform: translateX(0); }
            100% { transform: translateX(-40px); }
        }
        @keyframes moverOndasTras {
            0% { transform: translateX(-50px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>
     <div class="nuvem">
        <span class="nuvem1">☁️</span>
    </div>

    <div class="barco">
        <span class="barco1">🚢</span>
    </div>
    <div class="mar"></div>
</body>
</html>
