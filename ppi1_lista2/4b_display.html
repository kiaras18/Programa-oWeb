<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 2</title>
    <style>
         body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .texto{
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
         .container {
            display: flex;       
            width: 100%;         
        }
        .bloco {
            display: inline-block;
            width: 25%;
            height: 100px;
            text-align: center;
            line-height: 100px;
            font-weight: bold;
        }
        .b1 { background-color: blue; }
        .b2 { background-color: green; }
        .b3 { background-color: red; }
        .b4 { background-color: yellow; }
    </style>
</head>
<body>
    <div class="container">
        <div class="bloco b1">1</div>
        <div class="bloco b2">2</div>
        <div class="bloco b3">3</div>
        <div class="bloco b4">4</div>
    </div>
    
    
</body>
</html>
