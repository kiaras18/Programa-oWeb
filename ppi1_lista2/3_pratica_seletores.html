<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Prática de Seletores</title>

    <style>

        h1 {
            color: darkblue;
            text-align: center;
        }

        .p1 {
            color: red;
            font-family: Arial;
        }

        .p2 {
            color: green;
            font-family: Georgia;
        }

        .p3 {
            color: purple;
            font-family: Verdana;
        }

        .p4 {
            color: orange;
            font-family: "Courier New";
        }

        .destaque {
            background-color: yellow;
            font-weight: bold;
        }

        .importante {
            color: blue;
            text-decoration: underline;
        }

        .especial {
            background-color: pink;
            font-style: italic;
        }

    </style>
</head>

<body>

    <h1>Prática de Seletores CSS</h1>

    <p class="p1">
        Lorem ipsum dolor sit amet, 
        <span class="destaque">consectetur</span> adipiscing elit.
    </p>

    <p class="p2">
        Lorem ipsum dolor sit amet, 
        <span class="importante">adipiscing</span> elit.
    </p>

    <p class="p3">
        Lorem ipsum dolor sit amet, 
        <span class="especial">vestibulum</span> consectetur.
    </p>

    <p class="p4">
        Lorem ipsum dolor sit amet, 
        <span class="destaque">elementum</span> lorem.
    </p>

</body>
</html>
