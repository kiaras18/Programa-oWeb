
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
</head>
<body>

    <h1 id="titulo">Oie</h1>

    <div>
        <label for="iPeso">Peso:</label>
        <input type="number" id="iPeso" placeholder="Digite seu peso:" step="any">
        <br>

        <label for="iAltura">Altura:</label>
        <input type="number" id="iAltura" placeholder="Digite sua altura em metros:" step="any">
        <br>

        <button id="botao" type="button">Calcular</button>

        <p id="IMC"></p>
       <img id="imagem" src="../js/img_imc/perfil.jpg" width="250" alt="Resultado do IMC">
<p id="classificacao"></p>   
    </div>

    <script src="../js/scriptt.js"></script>

</body>
</html>
