<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorando Eventos em JavaScript</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #hoverDiv { width: 220px; padding: 25px; margin: 15px 0; background-color: lightgray; }
        #textInput { margin: 10px 0; }
    </style>
</head>
<body>
    <button id="alertButton">Clique aqui</button>
    <input type="text" id="textInput" placeholder="Digite algo">
    <div id="hoverDiv">Passe o mouse aqui</div>
    <select id="colorSelect">
        <option value="">Escolha uma cor</option>
        <option value="blue">Azul</option>
        <option value="green">Verde</option>
        <option value="red">Vermelho</option>
    </select>

    <script>
        let botao = document.getElementById("alertButton");
        let campo = document.getElementById("textInput");
        let div = document.getElementById("hoverDiv");
        let selecao = document.getElementById("colorSelect");

        let corOriginalCampo = campo.style.backgroundColor;
        let corOriginalDiv = div.style.backgroundColor;

        botao.addEventListener("click", function() {
            alert("Você clicou no botão!");
        });

        campo.addEventListener("keydown", function(evento) {
            console.log("Tecla pressionada: " + evento.key);
        });

        campo.addEventListener("focus", function() {
            campo.style.backgroundColor = "yellow";
        });

        campo.addEventListener("blur", function() {
            campo.style.backgroundColor = corOriginalCampo;
        });

        div.addEventListener("mouseover", function() {
            div.style.backgroundColor = "orange";
        });

        div.addEventListener("mouseout", function() {
            div.style.backgroundColor = corOriginalDiv;
        });

        selecao.addEventListener("change", function() {
            if (selecao.value !== "") {
                document.body.style.backgroundColor = selecao.value;
            }
        });
    </script>
</body>
</html>
