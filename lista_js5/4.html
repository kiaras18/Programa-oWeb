<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        input { margin: 6px 0 12px; padding: 6px; }
        #imgPerfil { display: block; width: 180px; margin-top: 12px; }
    </style>
</head>
<body>
    <h1>Calculadora de IMC</h1>

    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" placeholder="Digite seu nome"><br>

    <label for="peso">Peso (kg):</label><br>
    <input type="number" id="peso" step="0.1" placeholder="Digite seu peso"><br>

    <label for="altura">Altura (m):</label><br>
    <input type="number" id="altura" step="0.01" placeholder="Digite sua altura"><br>

    <button id="botao" type="button">Calcular</button>

    <p id="resultadoIMC"></p>
    <p id="classificacao"></p>
    <img id="imgPerfil" src="img_imc/perfil.jpg" alt="Imagem da classificação do IMC">

    <script>
        let botao = document.getElementById("botao");

        botao.addEventListener("click", function() {
            let nome = document.getElementById("nome").value.trim();
            let pesoTexto = document.getElementById("peso").value;
            let alturaTexto = document.getElementById("altura").value;
            let resultado = document.getElementById("resultadoIMC");
            let classificacao = document.getElementById("classificacao");
            let imagem = document.getElementById("imgPerfil");

            if (nome === "" || pesoTexto === "" || alturaTexto === "") {
                resultado.innerText = "Preencha todos os campos.";
                classificacao.innerText = "";
                imagem.src = "img_imc/perfil.jpg";
                return;
            }

            let peso = parseFloat(pesoTexto);
            let altura = parseFloat(alturaTexto);

            if (peso <= 0 || altura <= 0 || isNaN(peso) || isNaN(altura)) {
                resultado.innerText = "Digite valores válidos para peso e altura.";
                classificacao.innerText = "";
                imagem.src = "img/perfil.jpg";
                return;
            }

            let imc = peso / (altura * altura);
            resultado.innerText = "IMC de " + nome + ": " + imc.toFixed(2);

            if (imc < 18.5) {
                classificacao.innerText = "Abaixo do peso";
            } else if (imc < 25) {
                classificacao.innerText = "Peso normal";
            } else if (imc < 30) {
                classificacao.innerText = "Sobrepeso";
            } else if (imc < 35) {
                classificacao.innerText = "Obesidade grau 1";
            } else if (imc < 40) {
                classificacao.innerText = "Obesidade grau 2";
            } else {
                classificacao.innerText = "Obesidade grau 3";
            }

            let faixa = Math.floor(imc);

            switch (faixa) {
                case 0:
                case 1:
                case 2:
                case 3:
                case 4:
                case 5:
                case 6:
                case 7:
                case 8:
                case 9:
                case 10:
                case 11:
                case 12:
                case 13:
                case 14:
                case 15:
                case 16:
                case 17:
                case 18:
                    if (imc < 18.5) {
                        imagem.src = "img_imc/abaixopeso.png";
                    } else {
                        imagem.src = "img_imc/normal.png";
                    }
                    break;
                case 19:
                case 20:
                case 21:
                case 22:
                case 23:
                case 24:
                    imagem.src = "img_imc/normal.png";
                    break;
                case 25:
                case 26:
                case 27:
                case 28:
                case 29:
                    imagem.src = "img_imc/sobrepeso.png";
                    break;
                case 30:
                case 31:
                case 32:
                case 33:
                case 34:
                    imagem.src = "img_imc/obesidade1.png";
                    break;
                case 35:
                case 36:
                case 37:
                case 38:
                case 39:
                    imagem.src = "img_imc/obesidade2.png";
                    break;
                default:
                    imagem.src = "img_imc/obesidade3.png";
                    break;
            }
        });
    </script>
</body>
</html>
