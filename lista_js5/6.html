<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números Primos</title>
</head>
<body>
    <h1>Números Primos em um Intervalo</h1>

    <label for="inicio">Número inicial:</label>
    <input type="number" id="inicio"><br>

    <label for="fim">Número final:</label>
    <input type="number" id="fim"><br>

    <button type="button" id="botaoVerificar">Verificar</button>
    <div id="resultadoPrimos"></div>

    <script>
        function ehPrimo(n) {
            if (n < 2) {
                return false;
            }

            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) {
                    return false;
                }
            }

            return true;
        }

        document.getElementById("botaoVerificar").addEventListener("click", function() {
            let inicioTexto = document.getElementById("inicio").value;
            let fimTexto = document.getElementById("fim").value;
            let resultado = document.getElementById("resultadoPrimos");

            if (inicioTexto === "" || fimTexto === "") {
                resultado.innerText = "Preencha os dois valores.";
                return;
            }

            let inicio = parseInt(inicioTexto);
            let fim = parseInt(fimTexto);

            if (inicio > fim) {
                let troca = inicio;
                inicio = fim;
                fim = troca;
            }

            let primos = [];

            for (let numero = inicio; numero <= fim; numero++) {
                if (ehPrimo(numero)) {
                    primos.push(numero);
                }
            }

            if (primos.length === 0) {
                resultado.innerText = "Não existem números primos nesse intervalo.";
            } else {
                resultado.innerText = "Números primos encontrados: " + primos.join(", ");
            }
        });
    </script>
</body>
</html>
